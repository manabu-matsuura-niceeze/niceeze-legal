name: "NiceEze CI — Test・Lint・Security"

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install python-docx python-pptx bandit pytest

      - name: Run test_research
        run: python -m unittest tests.test_research -v

      - name: Run test_marketing_integration
        run: python -m unittest tests.test_marketing_integration -v

      - name: Run test_surplus_gate
        run: python -m unittest tests.test_surplus_gate -v

      - name: Run test_audit
        run: pytest tests/test_audit.py -v --tb=short

      - name: Security scan (bandit)
        run: bandit -r src/ -ll

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ./**/*.log
            ./**/*.xml
          if-no-files-found: ignore
