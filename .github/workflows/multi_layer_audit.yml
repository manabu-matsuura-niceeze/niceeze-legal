name: NiceEze 多層監査 CI/CD パイプライン Ver 2.5

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      force_gdrive_sync:
        description: 'Force Google Drive Sync'
        type: boolean
        required: false
        default: true

jobs:
  layer3-gdrive-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run full audit and GDrive sync
        env:
          NICEEZE_GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.NICEEZE_GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          python scripts/run_full_audit.py
