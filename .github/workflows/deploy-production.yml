name: "NiceEze Deploy — 本番（手動・CEO承認必須）"

# 本番デプロイは手動トリガーのみ。自動本番デプロイ禁止。
# デプロイ先: Railway（GCPから切り替え 2026-06-05）

on:
  workflow_dispatch:
    inputs:
      approved_by:
        description: "承認者名（松浦CEO）"
        required: true
        type: string
      confirm:
        description: "最終確認"
        required: true
        type: choice
        options:
          - "本番デプロイを承認する"
          - "キャンセル"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-approval:
    runs-on: ubuntu-latest
    steps:
      - name: 承認確認
        run: |
          if [ "${{ inputs.confirm }}" != "本番デプロイを承認する" ]; then
            echo "承認が確認できません。デプロイを中止します。"
            exit 1
          fi
          if [ -z "${{ inputs.approved_by }}" ]; then
            echo "承認者名を入力してください。"
            exit 1
          fi
          echo "承認者: ${{ inputs.approved_by }}"
          echo "承認時刻: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

  deploy-production:
    runs-on: ubuntu-latest
    needs: validate-approval
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install python-docx python-pptx bandit pytest

      - name: Final gate — Run test_research
        run: python -m unittest tests.test_research -v

      - name: Final gate — Run test_marketing_integration
        run: python -m unittest tests.test_marketing_integration -v

      - name: Final gate — Run test_surplus_gate
        run: python -m unittest tests.test_surplus_gate -v

      - name: Final gate — Run test_audit
        run: pytest tests/test_audit.py -v --tb=short

      - name: Final gate — Security scan (bandit)
        run: bandit -r src/ -ll

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy RESEARCH to Railway
        run: |
          echo "=== RESEARCH デプロイ開始 ==="
          railway up \
            --service niceeze-research \
            --detach \
            --environment production
          echo "RESEARCH デプロイ完了"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy MARKETING to Railway
        run: |
          echo "=== MARKETING デプロイ開始 ==="
          railway up \
            --service niceeze-marketing \
            --detach \
            --environment production
          echo "MARKETING デプロイ完了"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Railway デプロイURL取得
        run: |
          echo "=== Railway デプロイ完了 ==="
          railway status --service niceeze-research --environment production || true
          railway status --service niceeze-marketing --environment production || true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: 本番デプロイサマリー
        run: |
          echo "=============================="
          echo "  本番デプロイ完了サマリー（Railway）"
          echo "=============================="
          echo "承認者     : ${{ inputs.approved_by }}"
          echo "コミット   : ${{ github.sha }}"
          echo "デプロイ先 : Railway"
          echo "デプロイ時刻: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "テスト     : PASSED"
          echo "セキュリティ: PASSED"
          echo "=============================="
