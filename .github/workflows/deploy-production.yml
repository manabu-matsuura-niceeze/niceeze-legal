name: "NiceEze Deploy — 本番（手動・CEO承認必須）"

# 本番デプロイは手動トリガーのみ。自動本番デプロイ禁止。

on:
  workflow_dispatch:
    inputs:
      approved_by:
        description: "承認者名（松浦CEO）"
        required: true
        type: string
      confirm:
        description: "最終確認"
        required: true
        type: choice
        options:
          - "本番デプロイを承認する"
          - "キャンセル"

env:
  GCP_PROJECT_ID: serene-bonbon-236821
  GCP_REGION: asia-northeast1

jobs:
  validate-approval:
    runs-on: ubuntu-latest
    steps:
      - name: 承認確認
        run: |
          if [ "${{ inputs.confirm }}" != "本番デプロイを承認する" ]; then
            echo "承認が確認できません。デプロイを中止します。"
            exit 1
          fi
          if [ -z "${{ inputs.approved_by }}" ]; then
            echo "承認者名を入力してください。"
            exit 1
          fi
          echo "承認者: ${{ inputs.approved_by }}"
          echo "承認時刻: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

  deploy-production:
    runs-on: ubuntu-latest
    needs: validate-approval
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install python-docx python-pptx bandit pytest

      - name: Final gate — Run test_research
        run: python -m unittest tests.test_research -v

      - name: Final gate — Run test_marketing_integration
        run: python -m unittest tests.test_marketing_integration -v

      - name: Final gate — Run test_surplus_gate
        run: python -m unittest tests.test_surplus_gate -v

      - name: Final gate — Run test_audit
        run: pytest tests/test_audit.py -v --tb=short

      - name: Final gate — Security scan (bandit)
        run: bandit -r src/ -ll

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Enable required GCP APIs
        run: |
          echo "=== 必須GCP API有効化 ==="
          gcloud services enable artifactregistry.googleapis.com --project=${{ env.GCP_PROJECT_ID }} --quiet
          gcloud services enable run.googleapis.com --project=${{ env.GCP_PROJECT_ID }} --quiet
          gcloud services enable containerregistry.googleapis.com --project=${{ env.GCP_PROJECT_ID }} --quiet
          echo "API有効化完了"

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build and push RESEARCH image
        run: |
          docker build -f docker/research.Dockerfile \
            -t gcr.io/${{ env.GCP_PROJECT_ID }}/niceeze-research:latest \
            -t gcr.io/${{ env.GCP_PROJECT_ID }}/niceeze-research:${{ github.sha }} .
          docker push gcr.io/${{ env.GCP_PROJECT_ID }}/niceeze-research:latest
          docker push gcr.io/${{ env.GCP_PROJECT_ID }}/niceeze-research:${{ github.sha }}

      - name: Build and push MARKETING image
        run: |
          docker build -f docker/marketing.Dockerfile \
            -t gcr.io/${{ env.GCP_PROJECT_ID }}/niceeze-marketing:latest \
            -t gcr.io/${{ env.GCP_PROJECT_ID }}/niceeze-marketing:${{ github.sha }} .
          docker push gcr.io/${{ env.GCP_PROJECT_ID }}/niceeze-marketing:latest
          docker push gcr.io/${{ env.GCP_PROJECT_ID }}/niceeze-marketing:${{ github.sha }}

      - name: Deploy RESEARCH to Cloud Run
        run: |
          gcloud run deploy niceeze-research \
            --image gcr.io/${{ env.GCP_PROJECT_ID }}/niceeze-research:${{ github.sha }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --set-env-vars "NICEEZE_ENV=production,GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }}" \
            --project ${{ env.GCP_PROJECT_ID }}

      - name: Deploy MARKETING to Cloud Run
        run: |
          gcloud run deploy niceeze-marketing \
            --image gcr.io/${{ env.GCP_PROJECT_ID }}/niceeze-marketing:${{ github.sha }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8081 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --set-env-vars "NICEEZE_ENV=production,GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }}" \
            --project ${{ env.GCP_PROJECT_ID }}

      - name: Get Cloud Run URLs
        run: |
          echo "=== Cloud Run デプロイ完了 ==="
          RESEARCH_URL=$(gcloud run services describe niceeze-research \
            --region ${{ env.GCP_REGION }} --project ${{ env.GCP_PROJECT_ID }} \
            --format 'value(status.url)')
          MARKETING_URL=$(gcloud run services describe niceeze-marketing \
            --region ${{ env.GCP_REGION }} --project ${{ env.GCP_PROJECT_ID }} \
            --format 'value(status.url)')
          echo "RESEARCH URL : $RESEARCH_URL"
          echo "MARKETING URL: $MARKETING_URL"

      - name: Health check — RESEARCH
        run: |
          RESEARCH_URL=$(gcloud run services describe niceeze-research \
            --region ${{ env.GCP_REGION }} --project ${{ env.GCP_PROJECT_ID }} \
            --format 'value(status.url)')
          curl -sf "$RESEARCH_URL/health" | python3 -m json.tool
          echo "RESEARCH /health: OK"

      - name: Health check — MARKETING
        run: |
          MARKETING_URL=$(gcloud run services describe niceeze-marketing \
            --region ${{ env.GCP_REGION }} --project ${{ env.GCP_PROJECT_ID }} \
            --format 'value(status.url)')
          curl -sf "$MARKETING_URL/health" | python3 -m json.tool
          echo "MARKETING /health: OK"

      - name: 本番デプロイサマリー
        run: |
          echo "=============================="
          echo "  本番デプロイ完了サマリー"
          echo "=============================="
          echo "承認者     : ${{ inputs.approved_by }}"
          echo "コミット   : ${{ github.sha }}"
          echo "プロジェクト: ${{ env.GCP_PROJECT_ID }}"
          echo "リージョン : ${{ env.GCP_REGION }}"
          echo "デプロイ時刻: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "テスト     : PASSED"
          echo "セキュリティ: PASSED"
          echo "=============================="
