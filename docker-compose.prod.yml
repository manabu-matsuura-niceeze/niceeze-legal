version: '3.9'
services:
  research:
    build:
      context: .
      dockerfile: docker/research.Dockerfile
    image: niceeze-research:latest
    container_name: niceeze-research
    ports: ["8080:8080"]
    environment:
      - NICEEZE_ENV=production
      - KEEPA_API_KEY=${KEEPA_API_KEY}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks: [niceeze-net]

  marketing:
    build:
      context: .
      dockerfile: docker/marketing.Dockerfile
    image: niceeze-marketing:latest
    container_name: niceeze-marketing
    ports: ["8081:8081"]
    environment:
      - NICEEZE_ENV=production
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - CLOUD_FUNCTIONS_URL=${CLOUD_FUNCTIONS_URL}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks: [niceeze-net]

  nginx:
    image: nginx:alpine
    container_name: niceeze-nginx
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      research:
        condition: service_healthy
      marketing:
        condition: service_healthy
    restart: unless-stopped
    networks: [niceeze-net]

networks:
  niceeze-net:
    driver: bridge
