user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/niceeze.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/niceeze.log  main;

    sendfile        on;
    keepalive_timeout  65;

    gzip  on;
    gzip_types  application/json text/plain text/xml;
    gzip_min_length 256;

    upstream research {
        server research:8080;
    }

    upstream marketing {
        server marketing:8081;
    }

    server {
        listen 80;
        server_name _;

        # Security headers (ISMS ISO/IEC 27001:2022)
        add_header X-Content-Type-Options  "nosniff"         always;
        add_header X-Frame-Options         "DENY"            always;
        add_header X-XSS-Protection        "1; mode=block"   always;

        proxy_connect_timeout  10s;
        proxy_read_timeout     30s;

        location /api/research/ {
            proxy_pass         http://research/;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
        }

        location /api/marketing/ {
            proxy_pass         http://marketing/;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
        }
    }
}
