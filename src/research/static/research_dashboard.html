<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>NiceEze リサーチダッシュボード</title>
  <style>
    :root {
      --navy:   #1A2B4C;
      --amber:  #E8A020;
      --bg:     #F5F7FA;
      --white:  #FFFFFF;
      --border: #D1D9E6;
      --green:  #22863A;
      --green-bg: #DCFFE4;
      --text:   #1A2B4C;
      --muted:  #6B7A99;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
    }

    /* ── Header ── */
    header {
      background: var(--navy);
      color: var(--white);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header .logo-mark {
      width: 32px; height: 32px;
      background: var(--amber);
      border-radius: 6px;
      display: grid; place-items: center;
      font-weight: 800; font-size: 14px; color: var(--navy);
    }
    header h1 { font-size: 16px; font-weight: 700; letter-spacing: .02em; }
    header .badge {
      margin-left: auto;
      font-size: 10px; font-weight: 600;
      background: rgba(232,160,32,.2);
      color: var(--amber);
      border: 1px solid var(--amber);
      border-radius: 4px;
      padding: 2px 8px;
      letter-spacing: .04em;
    }

    /* ── Tab bar ── */
    .tab-bar {
      display: flex;
      background: var(--white);
      border-bottom: 2px solid var(--border);
      padding: 0 20px;
    }
    .tab-btn {
      padding: 12px 20px;
      font-size: 13px; font-weight: 600;
      color: var(--muted);
      background: none; border: none; cursor: pointer;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      transition: color .15s, border-color .15s;
    }
    .tab-btn.active {
      color: var(--navy);
      border-bottom-color: var(--amber);
    }
    .tab-btn:hover:not(.active) { color: var(--navy); }

    /* ── Panels ── */
    .panel { display: none; padding: 20px; }
    .panel.active { display: block; }

    /* ── Card ── */
    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .card-title {
      font-size: 13px; font-weight: 700;
      color: var(--navy);
      margin-bottom: 14px;
      display: flex; align-items: center; gap: 8px;
    }
    .card-title .tag {
      font-size: 10px; font-weight: 600;
      background: var(--navy); color: var(--white);
      border-radius: 4px; padding: 2px 7px;
      letter-spacing: .04em;
    }

    /* ── Search bar ── */
    .search-row {
      display: flex; gap: 8px; margin-bottom: 16px;
    }
    .search-row input {
      flex: 1;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 7px;
      font-size: 14px;
      color: var(--text);
      outline: none;
    }
    .search-row input:focus { border-color: var(--navy); }
    .btn-primary {
      padding: 9px 18px;
      background: var(--navy); color: var(--white);
      border: none; border-radius: 7px;
      font-size: 13px; font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-primary:hover { background: #253d6e; }
    .btn-primary:active { background: #162038; }

    /* ── Price table ── */
    .table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    table {
      width: 100%; border-collapse: collapse;
      font-size: 13px;
      min-width: 560px;
    }
    thead th {
      background: var(--navy);
      color: var(--white);
      padding: 9px 12px;
      text-align: left;
      font-weight: 600;
      font-size: 12px;
    }
    thead th.num {
      text-align: right;
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.04em;
    }
    tbody tr { border-bottom: 1px solid var(--border); }
    tbody tr:hover { background: #f0f4fa; }
    tbody td { padding: 9px 12px; }
    tbody td.num {
      text-align: right;
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.04em;
    }
    tr.cheapest td { background: #FFF8EC; }
    tr.cheapest td.supplier-name { color: var(--amber); font-weight: 700; }
    .amber-badge {
      display: inline-block;
      background: var(--amber); color: var(--navy);
      font-size: 10px; font-weight: 700;
      border-radius: 4px; padding: 1px 6px;
      margin-left: 4px;
    }
    .no-result {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      padding: 32px 0;
    }

    /* ── Category chips ── */
    .chips {
      display: flex; flex-wrap: wrap; gap: 8px;
      margin-bottom: 14px;
    }
    .chip {
      padding: 6px 12px;
      border: 1.5px solid var(--border);
      border-radius: 20px;
      font-size: 12px; font-weight: 500;
      cursor: pointer;
      background: var(--white);
      color: var(--text);
      transition: all .15s;
      white-space: nowrap;
    }
    .chip.selected {
      background: var(--navy); color: var(--white);
      border-color: var(--navy);
    }

    /* ── Mode buttons ── */
    .mode-row {
      display: flex; gap: 8px; flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .mode-btn {
      flex: 1; min-width: 90px;
      padding: 8px 12px;
      border: 1.5px solid var(--border);
      border-radius: 7px;
      font-size: 12px; font-weight: 600;
      cursor: pointer;
      background: var(--white);
      color: var(--muted);
      transition: all .15s;
    }
    .mode-btn.active {
      background: var(--amber); color: var(--navy);
      border-color: var(--amber);
    }

    /* ── Trend table ── */
    .score-cell {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.04em;
      font-weight: 600;
    }
    .badge-green {
      display: inline-block;
      background: var(--green-bg);
      color: var(--green);
      border: 1px solid #b7eec7;
      border-radius: 4px;
      font-size: 10px; font-weight: 700;
      padding: 1px 6px;
    }

    /* ── TODO card ── */
    .todo-section { margin-top: 20px; }
    .todo-section h3 {
      font-size: 13px; font-weight: 700;
      color: var(--navy);
      margin-bottom: 10px;
      display: flex; align-items: center; gap: 6px;
    }
    .todo-card {
      background: #FFF8EC;
      border: 1.5px solid var(--amber);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .todo-card .todo-title {
      font-weight: 700; color: var(--navy);
      margin-bottom: 4px;
    }
    .todo-card .todo-meta {
      font-size: 11px; color: var(--muted);
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.04em;
    }

    /* ── Footer cache indicator ── */
    .cache-bar {
      text-align: center;
      font-size: 10px; color: var(--muted);
      padding: 12px 0 20px;
    }

    /* ── Responsive ── */
    @media (min-width: 768px) {
      .panel { padding: 24px 32px; }
      .search-row input { font-size: 15px; }
      table { font-size: 14px; }
    }
  </style>

/* ============================================================
   NiceEze リサーチダッシュボード — MVP inline JS
   IndexedDB: niceeze_cache_v142 (version 142)
   No external dependencies.
   ============================================================ */

'use strict';

// ── IndexedDB setup ──────────────────────────────────────────
const DB_NAME    = 'niceeze_cache_v142';
const DB_VERSION = 142;
let   _db        = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('price_cache')) {
        db.createObjectStore('price_cache', { keyPath: 'keyword' });
      }
      if (!db.objectStoreNames.contains('trend_cache')) {
        db.createObjectStore('trend_cache', { keyPath: 'cacheKey' });
      }
    };
    req.onsuccess = e => { _db = e.target.result; resolve(_db); };
    req.onerror   = e => reject(e.target.error);
  });
}

function dbGet(store, key) {
  return new Promise((resolve, reject) => {
    if (!_db) return resolve(null);
    const tx = _db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = e => resolve(e.target.result || null);
    req.onerror   = e => reject(e.target.error);
  });
}

function dbPut(store, value) {
  return new Promise((resolve, reject) => {
    if (!_db) return resolve();
    const tx = _db.transaction(store, 'readwrite');
    const req = tx.objectStore(store).put(value);
    req.onsuccess = () => resolve();
    req.onerror   = e => reject(e.target.error);
  });
}

const SUPPLIERS_ORDER = ['Amazon','楽天市場','Yahoo!','au PAY','Qoo10','ヨドバシ','ビックカメラ','ヤマダ電機'];

function findMockPrices(keyword) {
  // Exact match first
  if (PRICE_MOCK[keyword]) return PRICE_MOCK[keyword];
  // Fuzzy: check if any mock key is contained in keyword or vice versa
  for (const k of Object.keys(PRICE_MOCK)) {
    if (keyword.includes(k) || k.includes(keyword)) return PRICE_MOCK[k];
  }
  return null;
}

function generateFallbackPrices(keyword) {
  // Generate plausible prices based on keyword hash for consistency
  let h = 0;
  for (let i = 0; i < keyword.length; i++) h = (h * 31 + keyword.charCodeAt(i)) & 0xffff;
  const base = 500 + (h % 4500);
  const qty  = [1, 6, 12, 24][(h >> 4) % 4];
  return SUPPLIERS_ORDER.map((mall, i) => ({
    mall,
    case_price: base + Math.round((Math.sin(i * 1.3 + h * 0.01) * 0.15 + Math.random() * 0.05) * base),
    qty,
    stock: i === 6 ? '取寄せ' : (Math.random() < 0.1 ? '残りわずか' : '在庫あり'),
  }));
}

async function runPriceSearch() {
  const kw = document.getElementById('a01-kw').value.trim();
  if (!kw) return;

  const cacheKey = kw;
  let rows = null;

  // Try IndexedDB cache first
  const cached = await dbGet('price_cache', cacheKey);
  if (cached && (Date.now() - cached.ts < 3600000)) {
    rows = cached.rows;
  } else {
    rows = findMockPrices(kw) || generateFallbackPrices(kw);
    await dbPut('price_cache', { keyword: cacheKey, rows, ts: Date.now() });
  }

  renderPriceTable(rows, kw);
}

function renderPriceTable(rows, keyword) {
  const tbody = document.getElementById('price-tbody');
  const noResult = document.getElementById('price-no-result');

  if (!rows || rows.length === 0) {
    tbody.innerHTML = '';
    noResult.style.display = '';
    return;
  }
  noResult.style.display = 'none';

  // Find cheapest
  const minPrice = Math.min(...rows.map(r => r.case_price));

  tbody.innerHTML = rows.map(r => {
    const isCheapest = r.case_price === minPrice;
    const unitPrice  = r.qty > 0 ? Math.round(r.case_price / r.qty) : r.case_price;
    return `<tr class="${isCheapest ? 'cheapest' : ''}">
      <td class="supplier-name">${esc(r.mall)}${isCheapest ? '<span class="amber-badge">最安</span>' : ''}</td>
      <td class="num">${r.case_price.toLocaleString('ja-JP')}</td>
      <td class="num">${unitPrice.toLocaleString('ja-JP')}</td>
      <td class="num">${r.qty}</td>
      <td>${esc(r.stock)}</td>
    </tr>`;
  }).join('');
}

async function runTrendSearch() {
  const kw   = document.getElementById('a02-kw').value.trim().toLowerCase();
  const cat  = selectedCategory;
  const mode = selectedMode;
  const cacheKey = `${cat}::${mode}::${kw}`;

  let rows = null;
  const cached = await dbGet('trend_cache', cacheKey);
  if (cached && (Date.now() - cached.ts < 3600000)) {
    rows = cached.rows;
  } else {
    const base = (TREND_DATA[cat] || {})[mode] || [];
    rows = kw ? base.filter(r => r.keyword.toLowerCase().includes(kw)) : base;
    if (rows.length === 0 && kw) {
      // Generate a single plausible row for unmatched keyword
      let h = 0;
      for (let i = 0; i < kw.length; i++) h = (h * 31 + kw.charCodeAt(i)) & 0xffff;
      rows = [{ keyword: kw, score: parseFloat((0.50 + (h % 450) / 1000).toFixed(2)), monthly: 5000 + (h % 40000) }];
    }
    await dbPut('trend_cache', { cacheKey, rows, ts: Date.now() });
  }

  renderTrendTable(rows, cat, mode);
}

const MODE_LABELS = { bestseller:'売れ筋', growth:'急成長', staple:'定番残存' };

function renderTrendTable(rows, cat, mode) {
  const card  = document.getElementById('trend-result-card');
  const title = document.getElementById('trend-result-title');
  const tbody = document.getElementById('trend-tbody');
  const todoSection = document.getElementById('todo-section');
  const todoCards   = document.getElementById('todo-cards');

  card.style.display = '';
  title.innerHTML = `<span class="tag">RES-A02</span> ${esc(cat)} — ${esc(MODE_LABELS[mode]||mode)}`;

  const sorted = [...rows].sort((a, b) => b.score - a.score);

  tbody.innerHTML = sorted.map(r => {
    const isHigh = r.score >= 0.6;
    const scoreFmt = r.score.toFixed(2);
    const badge = isHigh ? `<span class="badge-green">HIGH</span>` : '';
    return `<tr>
      <td>${esc(r.keyword)}</td>
      <td>${esc(cat)}</td>
      <td class="num score-cell">${scoreFmt} ${badge}</td>
      <td class="num">${r.monthly.toLocaleString('ja-JP')}</td>
      <td>${isHigh ? '&#9989; 推奨' : '&#9711; 様子見'}</td>
    </tr>`;
  }).join('');

  // TODO cards for score >= 0.8
  const highPriority = sorted.filter(r => r.score >= 0.8);
  if (highPriority.length > 0) {
    todoSection.style.display = '';
    todoCards.innerHTML = highPriority.map(r => `
      <div class="todo-card">
        <div class="todo-title">&#128204; ${esc(r.keyword)}</div>
        <div style="font-size:12px;color:#444;margin:4px 0 6px">
          カテゴリ: ${esc(cat)} &nbsp;|&nbsp; モード: ${esc(MODE_LABELS[mode]||mode)}
        </div>
        <div class="todo-meta">
          S_retention: ${r.score.toFixed(2)} &nbsp;&#8226;&nbsp; 月間検索数(推定): ${r.monthly.toLocaleString('ja-JP')}
        </div>
      </div>
    `).join('');
  } else {
    todoSection.style.display = 'none';
    todoCards.innerHTML = '';
  }
}

// ── Utility ──────────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
