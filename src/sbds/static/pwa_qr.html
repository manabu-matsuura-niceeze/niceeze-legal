<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR計測 — ブラウザ案内 | NiceEze SBDS</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <style>
    :root {
      --navy: #1A2B4C;
      --amber: #E8A020;
      --light-bg: #F5F7FA;
      --surface: rgba(255,255,255,0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans JP', system-ui, sans-serif;
      background: var(--navy);
      color: var(--light-bg);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1.5rem 3rem;
    }
    header {
      width: 100%;
      max-width: 480px;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }
    .back-btn {
      background: transparent;
      border: 1px solid rgba(245,247,250,0.35);
      color: var(--light-bg);
      padding: 0.35rem 0.85rem;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: none;
      font-family: inherit;
    }
    h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--amber);
      flex: 1;
    }
    .card {
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      border: 1px solid rgba(245,247,250,0.1);
      border-radius: 16px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .section-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--amber);
      font-weight: 700;
    }
    .explain {
      font-size: 0.88rem;
      line-height: 1.65;
      opacity: 0.85;
    }
    .explain strong { color: var(--amber); }
    .requirements {
      background: rgba(26,43,76,0.6);
      border-left: 3px solid var(--amber);
      border-radius: 0 8px 8px 0;
      padding: 0.85rem 1rem;
      font-size: 0.82rem;
      line-height: 1.7;
      opacity: 0.9;
    }
    .requirements li { list-style: none; display: flex; align-items: center; gap: 0.5rem; }
    .requirements li::before { content: '✓'; color: var(--amber); font-weight: 700; }
    #qr-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
    #qrcode {
      background: #fff;
      padding: 12px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    #qrcode img, #qrcode canvas { display: block; }
    .qr-instruction {
      font-size: 0.88rem;
      text-align: center;
      line-height: 1.55;
      opacity: 0.85;
    }
    .divider {
      border: none;
      border-top: 1px solid rgba(245,247,250,0.12);
    }
    .url-box {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    #ar-url-display {
      font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', monospace;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.04em;
      font-size: 0.75rem;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(245,247,250,0.15);
      border-radius: 8px;
      padding: 0.65rem 0.85rem;
      color: var(--light-bg);
      word-break: break-all;
      line-height: 1.5;
    }
    .copy-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      background: var(--amber);
      color: var(--navy);
      border: none;
      border-radius: 8px;
      padding: 0.65rem 1.25rem;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.2s;
    }
    .copy-btn:active { opacity: 0.75; }
    #copy-feedback {
      font-size: 0.78rem;
      color: var(--amber);
      text-align: center;
      min-height: 1.2em;
    }
    footer {
      margin-top: 2rem;
      font-size: 0.72rem;
      opacity: 0.45;
      text-align: center;
    }
  </style>
</head>
<body>

<header>
  <a href="tms_set_001.html" class="back-btn">← 戻る</a>
  <h1>AR計測 — ブラウザ案内</h1>
</header>

<div class="card">
  <div>
    <div class="section-label">対応環境について</div>
    <p class="explain" style="margin-top:0.5rem;">
      WebXR ARによる計測機能は、<strong>AndroidのChromeブラウザ</strong>と
      <strong>ARCore</strong>が必要です。現在のブラウザでは利用できません。
    </p>
    <ul class="requirements" style="margin-top:0.75rem;">
      <li>Android 8.0 以降</li>
      <li>Google Chrome（最新版）</li>
      <li>ARCore サービスがインストール済み</li>
    </ul>
  </div>

  <hr class="divider">

  <div id="qr-section">
    <div class="section-label">QRコードで開く</div>
    <div id="qrcode"></div>
    <p class="qr-instruction">AndroidのChromeでこのQRコードを読み取ってください</p>
  </div>

  <hr class="divider">

  <div class="url-box">
    <div class="section-label">URLを直接コピー</div>
    <div id="ar-url-display">読み込み中…</div>
    <button class="copy-btn" id="copy-btn">URLをコピー</button>
    <div id="copy-feedback"></div>
  </div>
</div>

<footer>NiceEze SBDS — AR計測サポートページ</footer>

<script>
(function () {
  const arUrl = window.location.origin + '/ar_measure.html';

  // Display URL
  const urlDisplay = document.getElementById('ar-url-display');
  urlDisplay.textContent = arUrl;

  // Generate QR code
  const qrEl = document.getElementById('qrcode');
  try {
    new QRCode(qrEl, {
      text: arUrl,
      width: 200,
      height: 200,
      colorDark: '#1A2B4C',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });
  } catch (e) {
    qrEl.textContent = 'QRコード生成エラー';
  }

  // Copy button
  const copyBtn = document.getElementById('copy-btn');
  const copyFeedback = document.getElementById('copy-feedback');
  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(arUrl);
      copyFeedback.textContent = 'コピーしました！';
    } catch (e) {
      // Fallback: select text
      const range = document.createRange();
      range.selectNodeContents(urlDisplay);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      copyFeedback.textContent = 'テキストを選択しました。長押しでコピーしてください。';
    }
    setTimeout(() => { copyFeedback.textContent = ''; }, 3000);
  });
})();
</script>
</body>
</html>
