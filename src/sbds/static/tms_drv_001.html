<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>TMS-DRV-001 | 配送スタッフ</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }

    /* ── レイアウト（LAYOUT_MASTER TMS-DRV-001準拠 固定3ゾーン） ── */
    #app { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; }

    /* 上部（固定ヘッダー） */
    #zone-top {
      background: #1e293b;
      border-bottom: 2px solid #334155;
      padding: 12px 16px;
    }
    .header-stats { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    .stat-block { display: flex; flex-direction: column; }
    .stat-label { font-size: 10px; color: #64748b; text-transform: uppercase; }
    .stat-value {
      font-family: ui-monospace, monospace; /* font-mono */
      font-variant-numeric: tabular-nums;   /* tabular-nums */
      letter-spacing: -0.02em;              /* tracking-tight */
      font-size: 20px;
      font-weight: 700;
      color: #f1f5f9;
    }
    .stat-value.floor { color: #60a5fa; }
    #screen-title { font-size: 11px; color: #94a3b8; margin-bottom: 8px; }

    /* 労働法ロックバナー */
    #labor-lock-banner {
      display: none;
      background: #7f1d1d;
      border: 2px solid #ef4444;
      border-radius: 6px;
      color: #fca5a5;
      font-size: 13px;
      font-weight: 700;
      margin-top: 8px;
      padding: 8px 12px;
      text-align: center;
    }
    #labor-lock-banner.show { display: block; }

    /* 中央: 配送リスト */
    #zone-mid { overflow-y: auto; padding: 12px 16px; }
    .pkg-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      margin-bottom: 10px;
      padding: 12px;
      transition: background 0.15s;
    }
    .pkg-card.completed {
      opacity: 0.4;
      border-color: #1e293b;
    }
    .pkg-card.frozen-warning {
      border-color: #ef4444;
      background: #1a0a0a;
    }
    .pkg-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
    .room-num {
      font-family: ui-monospace, monospace;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      font-size: 18px;
      font-weight: 700;
    }
    .pkg-flags { display: flex; gap: 6px; flex-wrap: wrap; }
    .flag {
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      text-transform: uppercase;
    }
    .flag-frozen { background: #1d4ed8; color: #bfdbfe; }
    .flag-refrigerated { background: #0e7490; color: #a5f3fc; }
    .flag-complaint { background: #92400e; color: #fde68a; }
    .frozen-alert {
      color: #ef4444;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-top: 4px;
      text-transform: uppercase;
    }
    .pkg-recipient { color: #94a3b8; font-size: 12px; margin-top: 4px; }
    .pkg-eta {
      font-family: ui-monospace, monospace;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      color: #60a5fa;
      font-size: 11px;
      margin-top: 6px;
    }
    .btn-complete {
      background: #059669;
      border: none;
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      font-size: 12px;
      margin-top: 8px;
      padding: 6px 14px;
      width: 100%;
    }
    .btn-complete:active { background: #10b981; }

    /* 下部: 動線マップ */
    #zone-btm {
      background: #1e293b;
      border-top: 2px solid #334155;
      padding: 12px 16px;
    }
    #zone-btm h3 { color: #94a3b8; font-size: 11px; margin-bottom: 8px; text-transform: uppercase; }
    #route-map {
      background: #0f172a;
      border-radius: 6px;
      color: #60a5fa;
      font-family: ui-monospace, monospace;
      font-size: 12px;
      padding: 10px;
      white-space: pre;
    }
    #eta-display {
      font-family: ui-monospace, monospace;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      color: #34d399;
      font-size: 13px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
<div id="app">

  <!-- 上部（固定ヘッダー） -->
  <header id="zone-top">
    <div id="screen-title">TMS-DRV-001 — 配送スタッフ画面</div>
    <div class="header-stats">
      <div class="stat-block">
        <span class="stat-label">本日配送総数</span>
        <span class="stat-value" id="stat-total">--</span>
      </div>
      <div class="stat-block">
        <span class="stat-label">現在フロア</span>
        <span class="stat-value floor" id="stat-floor">--F</span>
      </div>
      <div class="stat-block">
        <span class="stat-label">完了 / 未完了</span>
        <span class="stat-value" id="stat-progress">-- / --</span>
      </div>
    </div>
    <div id="labor-lock-banner">
      ⚠ STATUS_LOCKED_BY_LABOR_LAW — 4時間連続作業のため休憩必須です。管理者に連絡してください。
    </div>
  </header>

  <!-- 中央: 配送リスト -->
  <main id="zone-mid">
    <div id="pkg-list"></div>
  </main>

  <!-- 下部: 動線マップ -->
  <footer id="zone-btm">
    <h3>動線マップ</h3>
    <div id="route-map">EVホール → 廊下 → 各部屋</div>
    <div id="eta-display">推定到着残り時間: --</div>
  </footer>
</div>

<script>
// ── 定数 ──────────────────────────────────────────────────────────
const IDB_NAME = 'niceeze_cache_v142';
const IDB_VERSION = 142;
const STORE_PACKAGES = 'delivery_packages';
const STORE_SESSIONS = 'work_sessions';
const LABOR_LAW_MS = 4 * 60 * 60 * 1000;  // 4時間
const PULL_NOTIFY_MS = 60 * 1000;           // 1分前

// ── Jaro-Winkler ──────────────────────────────────────────────────
function jaro(s1, s2) {
  if (s1 === s2) return 1;
  const l1 = s1.length, l2 = s2.length;
  if (!l1 || !l2) return 0;
  const matchDist = Math.max(Math.floor(Math.max(l1, l2) / 2) - 1, 0);
  const m1 = new Array(l1).fill(false);
  const m2 = new Array(l2).fill(false);
  let matches = 0, trans = 0;
  for (let i = 0; i < l1; i++) {
    const start = Math.max(0, i - matchDist);
    const end = Math.min(i + matchDist + 1, l2);
    for (let j = start; j < end; j++) {
      if (m2[j] || s1[i] !== s2[j]) continue;
      m1[i] = m2[j] = true; matches++; break;
    }
  }
  if (!matches) return 0;
  let k = 0;
  for (let i = 0; i < l1; i++) {
    if (!m1[i]) continue;
    while (!m2[k]) k++;
    if (s1[i] !== s2[k]) trans++;
    k++;
  }
  return (matches/l1 + matches/l2 + (matches - trans/2)/matches) / 3;
}

function jaroWinkler(s1, s2, p = 0.1) {
  const j = jaro(s1, s2);
  let prefix = 0;
  for (let i = 0; i < Math.min(4, s1.length, s2.length); i++) {
    if (s1[i] === s2[i]) prefix++; else break;
  }
  return j + prefix * p * (1 - j);
}

// ── IndexedDB ─────────────────────────────────────────────────────
let db;
function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(IDB_NAME, IDB_VERSION);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(STORE_PACKAGES))
        d.createObjectStore(STORE_PACKAGES, { keyPath: 'package_id' });
      if (!d.objectStoreNames.contains(STORE_SESSIONS))
        d.createObjectStore(STORE_SESSIONS, { keyPath: 'staff_id' });
    };
    req.onsuccess = e => { db = e.target.result; res(db); };
    req.onerror = e => rej(e.target.error);
  });
}

function idbGetAll(store) {
  return new Promise((res, rej) => {
    const req = db.transaction(store, 'readonly').objectStore(store).getAll();
    req.onsuccess = () => res(req.result);
    req.onerror = e => rej(e.target.error);
  });
}

function idbPut(store, data) {
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(data).onsuccess = () => res();
    tx.onerror = e => rej(e.target.error);
  });
}

// ── 労働法ロック ──────────────────────────────────────────────────
let workStartTs = Date.now();

function checkLaborLaw() {
  const elapsed = Date.now() - workStartTs;
  const locked = elapsed >= LABOR_LAW_MS;
  document.getElementById('labor-lock-banner').className = locked ? 'show' : '';
  return locked;
}

// ── ルーティングソート ─────────────────────────────────────────────
function sortPackages(pkgs) {
  return [...pkgs].sort((a, b) => {
    if (a.floor !== b.floor) return a.floor - b.floor;
    if (a.is_complaint_risk !== b.is_complaint_risk) return a.is_complaint_risk - b.is_complaint_risk;
    return a.ev_exit_distance_m - b.ev_exit_distance_m;
  });
}

// ── ETA計算 ───────────────────────────────────────────────────────
function calcETA(pkgs) {
  const WALK_SPEED = 1.2; // m/s
  const EV_WAIT = 30;     // 秒
  let ts = Date.now() / 1000;
  let currentFloor = 1;
  return pkgs.map(p => {
    if (p.floor !== currentFloor) { ts += EV_WAIT; currentFloor = p.floor; }
    ts += p.ev_exit_distance_m / WALK_SPEED;
    return { ...p, estimated_arrival_ts: ts };
  });
}

// ── PULL通知判定 ──────────────────────────────────────────────────
function shouldNotify(pkg) {
  if (!pkg.estimated_arrival_ts) return false;
  const remaining = pkg.estimated_arrival_ts - Date.now() / 1000;
  return remaining > 0 && remaining <= 60;
}

// ── UI描画 ────────────────────────────────────────────────────────
let packages = [];

function renderList() {
  const sorted = sortPackages(packages);
  const withETA = calcETA(sorted);
  const completed = packages.filter(p => p.status === 'COMPLETED').length;
  const total = packages.length;
  const currentFloor = withETA.find(p => p.status !== 'COMPLETED')?.floor ?? '--';

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-floor').textContent = currentFloor + 'F';
  document.getElementById('stat-progress').textContent = `${completed} / ${total - completed}`;

  const list = document.getElementById('pkg-list');
  list.innerHTML = '';

  withETA.forEach(pkg => {
    const card = document.createElement('div');
    card.className = 'pkg-card'
      + (pkg.status === 'COMPLETED' ? ' completed' : '')
      + ((pkg.is_frozen || pkg.is_refrigerated) && pkg.status !== 'COMPLETED' ? ' frozen-warning' : '');

    const flags = [
      pkg.is_frozen ? '<span class="flag flag-frozen">冷凍</span>' : '',
      pkg.is_refrigerated ? '<span class="flag flag-refrigerated">冷蔵</span>' : '',
      pkg.is_complaint_risk ? '<span class="flag flag-complaint">要注意</span>' : '',
    ].join('');

    const frozenAlert = (pkg.is_frozen || pkg.is_refrigerated) && pkg.status !== 'COMPLETED'
      ? '<div class="frozen-alert">【ロッカー格納禁止：手渡し必須】</div>' : '';

    const etaTs = pkg.estimated_arrival_ts;
    const remaining = etaTs ? Math.max(0, Math.round(etaTs - Date.now() / 1000)) : null;
    const etaStr = remaining !== null
      ? `推定到着まで: ${Math.floor(remaining/60)}分${remaining%60}秒`
      : '';

    const jw = jaroWinkler(pkg.recipient_name, pkg.recipient_name); // self-check demo
    const nameLabel = `配送スタッフ確認: ${pkg.recipient_name}`;

    card.innerHTML = `
      <div class="pkg-header">
        <span class="room-num">${pkg.floor}F-${pkg.room_number}</span>
        <div class="pkg-flags">${flags}</div>
      </div>
      ${frozenAlert}
      <div class="pkg-recipient">${nameLabel}</div>
      ${etaStr ? `<div class="pkg-eta">${etaStr}</div>` : ''}
      ${pkg.status !== 'COMPLETED'
        ? `<button class="btn-complete" onclick="completePackage('${pkg.package_id}')">完了 ✓</button>`
        : '<div style="color:#059669;font-size:12px;margin-top:6px;">✓ 配送完了</div>'
      }
    `;
    list.appendChild(card);
  });

  updateRouteMap(withETA);
}

function updateRouteMap(pkgs) {
  const next = pkgs.find(p => p.status !== 'COMPLETED');
  if (!next) {
    document.getElementById('route-map').textContent = '全件配送完了 ✓';
    document.getElementById('eta-display').textContent = '';
    return;
  }
  const remaining = Math.max(0, Math.round(next.estimated_arrival_ts - Date.now() / 1000));
  document.getElementById('route-map').textContent =
    `EVホール → 廊下(${next.ev_exit_distance_m}m) → ${next.floor}F-${next.room_number}`;
  document.getElementById('eta-display').textContent =
    `推定到着残り時間: ${Math.floor(remaining/60)}分 ${remaining%60}秒`;
}

async function completePackage(id) {
  if (checkLaborLaw()) return;
  const pkg = packages.find(p => p.package_id === id);
  if (!pkg) return;
  pkg.status = 'COMPLETED';
  await idbPut(STORE_PACKAGES, pkg);
  renderList();
}

// ── デモデータ ────────────────────────────────────────────────────
function loadDemoData() {
  packages = [
    { package_id: 'p001', room_number: '0101', recipient_name: '配送スタッフ受取A', floor: 1, ev_exit_distance_m: 10, is_frozen: false, is_refrigerated: false, is_complaint_risk: false, status: 'PENDING', _idb_version: 142 },
    { package_id: 'p002', room_number: '0203', recipient_name: '配送スタッフ受取B', floor: 2, ev_exit_distance_m: 25, is_frozen: true, is_refrigerated: false, is_complaint_risk: false, status: 'PENDING', _idb_version: 142 },
    { package_id: 'p003', room_number: '0201', recipient_name: '配送スタッフ受取C', floor: 2, ev_exit_distance_m: 8, is_frozen: false, is_refrigerated: true, is_complaint_risk: false, status: 'PENDING', _idb_version: 142 },
    { package_id: 'p004', room_number: '0205', recipient_name: '配送スタッフ受取D', floor: 2, ev_exit_distance_m: 40, is_frozen: false, is_refrigerated: false, is_complaint_risk: true, status: 'PENDING', _idb_version: 142 },
    { package_id: 'p005', room_number: '0302', recipient_name: '配送スタッフ受取E', floor: 3, ev_exit_distance_m: 15, is_frozen: false, is_refrigerated: false, is_complaint_risk: false, status: 'PENDING', _idb_version: 142 },
  ];
}

// ── 定期更新（ETA残り時間） ───────────────────────────────────────
setInterval(() => {
  checkLaborLaw();
  renderList();
}, 1000);

// ── 初期化 ────────────────────────────────────────────────────────
(async () => {
  await openDB();
  const saved = await idbGetAll(STORE_PACKAGES);
  if (saved.length > 0 && saved[0]._idb_version === IDB_VERSION) {
    packages = saved;
  } else {
    loadDemoData();
    for (const p of packages) await idbPut(STORE_PACKAGES, p);
  }
  renderList();
})();
</script>
</body>
</html>
