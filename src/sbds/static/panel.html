<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>NiceEze タッチパネル</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1f2e;
      color: #ffffff;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* ── ヘッダー ── */
    header {
      background: #111623;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #EC6D74;
    }
    .logo {
      font-size: 32px;
      font-weight: 900;
      color: #EC6D74;
      letter-spacing: 2px;
    }
    .logo span { color: #6EA7DB; }
    #clock {
      font-size: 22px;
      color: #aab4cc;
      font-variant-numeric: tabular-nums;
    }

    /* ── 画面切替 ── */
    .screen { display: none; flex-direction: column; flex: 1; }
    .screen.active { display: flex; }

    /* ── 言語選択画面 ── */
    #lang-screen {
      padding: 24px 16px;
      gap: 16px;
    }
    .lang-title {
      text-align: center;
      font-size: 26px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }
    .lang-subtitle {
      text-align: center;
      font-size: 18px;
      color: #aab4cc;
      margin-bottom: 16px;
    }
    .lang-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      padding: 0 4px;
    }
    @media (min-width: 600px) {
      .lang-grid { grid-template-columns: repeat(4, 1fr); }
    }
    .lang-btn {
      background: #222840;
      border: 2px solid #3a4460;
      border-radius: 16px;
      padding: 20px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      touch-action: manipulation;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      min-height: 120px;
      justify-content: center;
    }
    .lang-btn:active { background: #2c3555; border-color: #6EA7DB; transform: scale(0.97); }
    .lang-btn.selected { background: #1e3a5f; border-color: #6EA7DB; }
    .lang-flag {
      font-size: 44px;
      line-height: 1;
    }
    .lang-name {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      text-align: center;
    }
    .lang-native {
      font-size: 13px;
      color: #aab4cc;
      text-align: center;
    }

    /* ── メインメニュー画面 ── */
    #main-screen {
      padding: 24px 20px;
      gap: 24px;
    }

    .current-lang-bar {
      background: #222840;
      border-radius: 12px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #3a4460;
    }
    .current-lang-info {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 20px;
    }
    .change-lang-btn {
      background: #3a4460;
      border: none;
      border-radius: 8px;
      color: #aab4cc;
      font-size: 15px;
      padding: 8px 16px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .change-lang-btn:active { background: #4a5478; }

    .section-title {
      font-size: 20px;
      color: #aab4cc;
      margin-bottom: 12px;
      font-weight: 600;
    }

    /* ── ボタン共通 ── */
    .main-btn {
      width: 100%;
      min-height: 200px;
      border: none;
      border-radius: 16px;
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
      transition: filter 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 20px;
      touch-action: manipulation;
    }
    .main-btn:active { filter: brightness(0.85); transform: scale(0.98); }

    .btn-support { background: #EC6D74; }
    .btn-unlock  { background: #6EA7DB; }
    .btn-qrcheck { background: #4a5568; }

    /* ── フォームカード ── */
    .card {
      background: #222840;
      border-radius: 16px;
      padding: 24px;
    }

    select, input[type="text"], textarea {
      width: 100%;
      background: #1a1f2e;
      border: 2px solid #3a4460;
      border-radius: 10px;
      color: #ffffff;
      font-size: 22px;
      padding: 14px 16px;
      margin-top: 10px;
      outline: none;
      -webkit-appearance: none;
    }
    select:focus, input[type="text"]:focus, textarea:focus {
      border-color: #6EA7DB;
    }
    textarea { min-height: 90px; resize: vertical; }

    label { font-size: 18px; color: #aab4cc; display: block; margin-top: 14px; }
    label:first-child { margin-top: 0; }

    /* ── 送信ボタン ── */
    .submit-btn {
      margin-top: 18px;
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 12px;
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
      touch-action: manipulation;
    }
    .submit-support { background: #EC6D74; }
    .submit-unlock  { background: #6EA7DB; }
    .submit-qr      { background: #4a5568; }
    .submit-btn:active { filter: brightness(0.85); }

    /* ── 応答エリア ── */
    #response-area {
      background: #222840;
      border-radius: 16px;
      padding: 24px;
      min-height: 80px;
      font-size: 22px;
      line-height: 1.6;
      border: 2px solid #3a4460;
      display: none;
    }
    #response-area.visible { display: block; }
    #response-area.error { border-color: #EC6D74; color: #EC6D74; }
    #response-area.success { border-color: #6EA7DB; }

    /* ── フッター ── */
    footer {
      background: #111623;
      border-top: 1px solid #2a3050;
      padding: 16px 24px;
      text-align: center;
      font-size: 15px;
      color: #5a6480;
    }

    /* ── アコーディオン ── */
    .accordion-body { display: none; }
    .accordion-body.open { display: block; }
    .accordion-toggle { cursor: pointer; user-select: none; }
    .toggle-icon { font-size: 20px; float: right; transition: transform 0.2s; }
    .accordion-toggle.active .toggle-icon { transform: rotate(180deg); }

    /* RTL (Arabic) */
    .rtl { direction: rtl; text-align: right; }
  </style>
</head>
<body>

<!-- ヘッダー -->
<header>
  <div class="logo">Nice<span>Eze</span></div>
  <div id="clock">--:--:--</div>
</header>

<!-- ① 言語選択画面 -->
<div id="lang-screen" class="screen active">
  <div class="lang-title">🌐 言語を選択 / Select Language</div>
  <div class="lang-subtitle">ご希望の言語をタッチしてください</div>
  <div class="lang-grid">
    <button class="lang-btn" onclick="selectLang('ja')">
      <span class="lang-flag">🇯🇵</span>
      <span class="lang-name">日本語</span>
      <span class="lang-native">Japanese</span>
    </button>
    <button class="lang-btn" onclick="selectLang('en')">
      <span class="lang-flag">🇬🇧</span>
      <span class="lang-name">English</span>
      <span class="lang-native">英語</span>
    </button>
    <button class="lang-btn" onclick="selectLang('zh-CN')">
      <span class="lang-flag">🇨🇳</span>
      <span class="lang-name">中文（简体）</span>
      <span class="lang-native">Simplified Chinese</span>
    </button>
    <button class="lang-btn" onclick="selectLang('zh-TW')">
      <span class="lang-flag">🇹🇼</span>
      <span class="lang-name">中文（繁體）</span>
      <span class="lang-native">Traditional Chinese</span>
    </button>
    <button class="lang-btn" onclick="selectLang('ko')">
      <span class="lang-flag">🇰🇷</span>
      <span class="lang-name">한국어</span>
      <span class="lang-native">Korean</span>
    </button>
    <button class="lang-btn" onclick="selectLang('th')">
      <span class="lang-flag">🇹🇭</span>
      <span class="lang-name">ภาษาไทย</span>
      <span class="lang-native">Thai</span>
    </button>
    <button class="lang-btn" onclick="selectLang('fr')">
      <span class="lang-flag">🇫🇷</span>
      <span class="lang-name">Français</span>
      <span class="lang-native">French</span>
    </button>
    <button class="lang-btn" onclick="selectLang('it')">
      <span class="lang-flag">🇮🇹</span>
      <span class="lang-name">Italiano</span>
      <span class="lang-native">Italian</span>
    </button>
    <button class="lang-btn" onclick="selectLang('de')">
      <span class="lang-flag">🇩🇪</span>
      <span class="lang-name">Deutsch</span>
      <span class="lang-native">German</span>
    </button>
    <button class="lang-btn" onclick="selectLang('es')">
      <span class="lang-flag">🇪🇸</span>
      <span class="lang-name">Español</span>
      <span class="lang-native">Spanish</span>
    </button>
    <button class="lang-btn" onclick="selectLang('pt')">
      <span class="lang-flag">🇧🇷</span>
      <span class="lang-name">Português</span>
      <span class="lang-native">Portuguese</span>
    </button>
    <button class="lang-btn" onclick="selectLang('id')">
      <span class="lang-flag">🇮🇩</span>
      <span class="lang-name">Bahasa Indonesia</span>
      <span class="lang-native">Indonesian</span>
    </button>
    <button class="lang-btn" onclick="selectLang('ar')">
      <span class="lang-flag">🇸🇦</span>
      <span class="lang-name">العربية</span>
      <span class="lang-native">Arabic</span>
    </button>
    <button class="lang-btn" onclick="selectLang('hi')">
      <span class="lang-flag">🇮🇳</span>
      <span class="lang-name">हिन्दी</span>
      <span class="lang-native">Hindi</span>
    </button>
  </div>
</div>

<!-- ② メインメニュー画面 -->
<div id="main-screen" class="screen">

  <!-- 現在の言語バー -->
  <div class="current-lang-bar">
    <div class="current-lang-info">
      <span id="current-flag" style="font-size:30px;">🇯🇵</span>
      <span id="current-lang-name" style="font-size:18px;">日本語</span>
    </div>
    <button class="change-lang-btn" onclick="showLangScreen()">
      🌐 変更 / Change
    </button>
  </div>

  <!-- ① サポートを呼ぶ -->
  <div>
    <div class="card">
      <div class="section-title accordion-toggle" onclick="toggleAccordion('support-form', this)">
        <span id="lbl-support-title">サポートを呼ぶ / Ask Support</span>
        <span class="toggle-icon">▼</span>
      </div>
      <div class="accordion-body open" id="support-form">
        <label id="lbl-category">カテゴリ / Category</label>
        <select id="support-cat">
          <option value="general">一般問い合わせ / General</option>
          <option value="baggage_tracking">荷物追跡 / Tracking</option>
          <option value="lost_baggage">荷物紛失 / Lost Baggage</option>
          <option value="delivery_schedule">配送スケジュール / Schedule</option>
          <option value="hub_location">拠点案内 / Hub Info</option>
        </select>

        <label id="lbl-message">メッセージ（省略可）/ Message (optional)</label>
        <textarea id="support-msg" placeholder="ご質問をどうぞ…"></textarea>

        <label id="lbl-qr-support">QR ID（省略可）/ QR ID (optional)</label>
        <input type="text" id="support-qr" placeholder="QR ID">

        <button class="submit-btn submit-support" onclick="submitSupport()" id="btn-call-support">
          サポートを呼ぶ / Call Support
        </button>
      </div>
    </div>
  </div>

  <!-- ② 解錠リクエスト -->
  <div>
    <div class="card">
      <div class="section-title accordion-toggle" onclick="toggleAccordion('unlock-form', this)">
        <span id="lbl-unlock-title">解錠リクエスト / Unlock Request</span>
        <span class="toggle-icon">▼</span>
      </div>
      <div class="accordion-body" id="unlock-form">
        <label id="lbl-qr-token">QRトークン / QR Token</label>
        <input type="text" id="unlock-token" placeholder="QRトークンを入力">

        <button class="submit-btn submit-unlock" onclick="submitUnlock()" id="btn-send-unlock">
          解錠リクエスト送信 / Send Unlock Request
        </button>
      </div>
    </div>
  </div>

  <!-- ③ QR確認 -->
  <div>
    <div class="card">
      <div class="section-title accordion-toggle" onclick="toggleAccordion('qrcheck-form', this)">
        <span id="lbl-qrcheck-title">QR確認 / QR Check</span>
        <span class="toggle-icon">▼</span>
      </div>
      <div class="accordion-body" id="qrcheck-form">
        <label id="lbl-qr-id">QR IDまたはトークン / QR ID or Token</label>
        <input type="text" id="qrcheck-token" placeholder="QR IDを入力">

        <button class="submit-btn submit-qr" onclick="submitQRCheck()" id="btn-check-qr">
          QRを確認 / Check QR
        </button>
      </div>
    </div>
  </div>

  <!-- 応答表示エリア -->
  <div id="response-area" role="status" aria-live="polite"></div>

</div>

<!-- フッター -->
<footer>
  NiceEze 手ぶら旅行システム v2.1 &nbsp;|&nbsp; 14言語対応 / 14 Languages &nbsp;|&nbsp; support@niceeze.com
</footer>

<script>
  'use strict';

  /* ── 言語データ ── */
  const LANG_META = {
    'ja':    { flag: '🇯🇵', name: '日本語', dir: 'ltr' },
    'en':    { flag: '🇬🇧', name: 'English', dir: 'ltr' },
    'zh-CN': { flag: '🇨🇳', name: '中文（简体）', dir: 'ltr' },
    'zh-TW': { flag: '🇹🇼', name: '中文（繁體）', dir: 'ltr' },
    'ko':    { flag: '🇰🇷', name: '한국어', dir: 'ltr' },
    'th':    { flag: '🇹🇭', name: 'ภาษาไทย', dir: 'ltr' },
    'fr':    { flag: '🇫🇷', name: 'Français', dir: 'ltr' },
    'it':    { flag: '🇮🇹', name: 'Italiano', dir: 'ltr' },
    'de':    { flag: '🇩🇪', name: 'Deutsch', dir: 'ltr' },
    'es':    { flag: '🇪🇸', name: 'Español', dir: 'ltr' },
    'pt':    { flag: '🇧🇷', name: 'Português', dir: 'ltr' },
    'id':    { flag: '🇮🇩', name: 'Bahasa Indonesia', dir: 'ltr' },
    'ar':    { flag: '🇸🇦', name: 'العربية', dir: 'rtl' },
    'hi':    { flag: '🇮🇳', name: 'हिन्दी', dir: 'ltr' },
  };

  /* ── UI文言（多言語） ── */
  const UI_STRINGS = {
    supportTitle:  { ja:'サポートを呼ぶ', en:'Call Support', 'zh-CN':'呼叫服务', 'zh-TW':'呼叫服務', ko:'지원 요청', th:'เรียกเจ้าหน้าที่', fr:'Appeler le support', it:'Chiama supporto', de:'Support rufen', es:'Llamar soporte', pt:'Chamar suporte', id:'Panggil staf', ar:'طلب الدعم', hi:'सहायता बुलाएं' },
    unlockTitle:   { ja:'解錠リクエスト', en:'Unlock Request', 'zh-CN':'解锁申请', 'zh-TW':'解鎖申請', ko:'잠금 해제', th:'ขอเปิดล็อก', fr:'Demande déverrouillage', it:'Sblocco', de:'Entsperrung', es:'Solicitud desbloqueo', pt:'Desbloqueio', id:'Permintaan buka kunci', ar:'طلب فتح القفل', hi:'अनलॉक अनुरोध' },
    qrcheckTitle:  { ja:'QR確認', en:'QR Check', 'zh-CN':'QR查询', 'zh-TW':'QR查詢', ko:'QR 확인', th:'ตรวจสอบ QR', fr:'Vérification QR', it:'Verifica QR', de:'QR-Prüfung', es:'Verificar QR', pt:'Verificar QR', id:'Periksa QR', ar:'فحص QR', hi:'QR जाँच' },
    btnSupport:    { ja:'サポートを呼ぶ', en:'Call Support', 'zh-CN':'呼叫服务', 'zh-TW':'呼叫服務', ko:'지원 요청', th:'เรียกเจ้าหน้าที่', fr:'Appeler', it:'Chiama', de:'Rufen', es:'Llamar', pt:'Chamar', id:'Panggil', ar:'اتصل', hi:'बुलाएं' },
    btnUnlock:     { ja:'解錠リクエスト送信', en:'Send Unlock Request', 'zh-CN':'发送解锁申请', 'zh-TW':'發送解鎖申請', ko:'잠금 해제 요청', th:'ส่งคำขอเปิดล็อก', fr:'Envoyer', it:'Invia', de:'Senden', es:'Enviar', pt:'Enviar', id:'Kirim', ar:'إرسال', hi:'भेजें' },
    btnQRCheck:    { ja:'QRを確認', en:'Check QR', 'zh-CN':'查询QR', 'zh-TW':'查詢QR', ko:'QR 확인', th:'ตรวจสอบ', fr:'Vérifier', it:'Verifica', de:'Prüfen', es:'Verificar', pt:'Verificar', id:'Periksa', ar:'فحص', hi:'जाँचें' },
  };

  const WAIT_MSGS = {
    ja:'しばらくお待ちください…', en:'Please wait…', 'zh-CN':'请稍候…', 'zh-TW':'請稍候…',
    ko:'잠시만 기다려 주세요…', th:'กรุณารอสักครู่…', fr:'Veuillez patienter…', it:'Attendere…',
    de:'Bitte warten…', es:'Por favor espere…', pt:'Aguarde…', id:'Mohon tunggu…',
    ar:'يرجى الانتظار…', hi:'कृपया प्रतीक्षा करें…',
  };
  const ERROR_MSGS = {
    ja:'エラーが発生しました。', en:'An error occurred.', 'zh-CN':'发生错误。', 'zh-TW':'發生錯誤。',
    ko:'오류가 발생했습니다.', th:'เกิดข้อผิดพลาด', fr:'Une erreur est survenue.', it:'Si è verificato un errore.',
    de:'Ein Fehler ist aufgetreten.', es:'Se produjo un error.', pt:'Ocorreu um erro.',
    id:'Terjadi kesalahan.', ar:'حدث خطأ.', hi:'एक त्रुटि हुई।',
  };

  let currentLang = 'ja';

  /* ── 言語選択 ── */
  function selectLang(lang) {
    currentLang = lang;
    const meta = LANG_META[lang] || LANG_META['ja'];

    // 現在の言語バー更新
    document.getElementById('current-flag').textContent = meta.flag;
    document.getElementById('current-lang-name').textContent = meta.name;

    // RTL対応
    document.documentElement.dir = meta.dir;

    // UI文言更新
    updateUIStrings(lang);

    // 画面切替
    document.getElementById('lang-screen').classList.remove('active');
    document.getElementById('main-screen').classList.add('active');
  }

  function showLangScreen() {
    document.getElementById('main-screen').classList.remove('active');
    document.getElementById('lang-screen').classList.add('active');
    document.documentElement.dir = 'ltr';
  }

  function updateUIStrings(lang) {
    const s = UI_STRINGS;
    function get(obj) { return obj[lang] || obj['en'] || obj['ja']; }
    document.getElementById('lbl-support-title').textContent = get(s.supportTitle);
    document.getElementById('lbl-unlock-title').textContent = get(s.unlockTitle);
    document.getElementById('lbl-qrcheck-title').textContent = get(s.qrcheckTitle);
    document.getElementById('btn-call-support').textContent = get(s.btnSupport);
    document.getElementById('btn-send-unlock').textContent = get(s.btnUnlock);
    document.getElementById('btn-check-qr').textContent = get(s.btnQRCheck);
  }

  /* ── 時刻更新 ── */
  function updateClock() {
    document.getElementById('clock').textContent =
      new Date().toLocaleTimeString('ja-JP', { hour12: false });
  }
  updateClock();
  setInterval(updateClock, 1000);

  /* ── アコーディオン ── */
  function toggleAccordion(id, toggle) {
    document.getElementById(id).classList.toggle('open');
    toggle.classList.toggle('active');
  }

  /* ── 応答表示 ── */
  function showResponse(text, isError) {
    const el = document.getElementById('response-area');
    el.textContent = text;
    el.className = 'visible ' + (isError ? 'error' : 'success');
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function errMsg(lang) { return ERROR_MSGS[lang] || ERROR_MSGS['ja']; }
  function waitMsg(lang) { return WAIT_MSGS[lang] || WAIT_MSGS['ja']; }

  const BASE = '/api/v1/travel';

  /* ── ① サポートを呼ぶ ── */
  async function submitSupport() {
    const lang = currentLang;
    showResponse(waitMsg(lang), false);
    const payload = {
      language: lang,
      category: document.getElementById('support-cat').value,
      message: document.getElementById('support-msg').value.trim(),
      qr_id: document.getElementById('support-qr').value.trim(),
    };
    try {
      const res = await fetch(BASE + '/support/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      showResponse(res.ok ? (data.response_text || JSON.stringify(data)) : (data.error || errMsg(lang)), !res.ok);
    } catch (_) {
      showResponse(errMsg(lang), true);
    }
  }

  /* ── ② 解錠リクエスト ── */
  async function submitUnlock() {
    const lang = currentLang;
    const token = document.getElementById('unlock-token').value.trim();
    if (!token) {
      showResponse('QRトークンを入力してください / Please enter QR token', true);
      return;
    }
    showResponse(waitMsg(lang), false);
    try {
      const res = await fetch(BASE + '/support/unlock-request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, lang, auto_approve: false }),
      });
      const data = await res.json();
      showResponse(res.ok ? (data.message || JSON.stringify(data)) : (data.error || errMsg(lang)), !res.ok);
    } catch (_) {
      showResponse(errMsg(lang), true);
    }
  }

  /* ── ③ QR確認 ── */
  async function submitQRCheck() {
    const token = document.getElementById('qrcheck-token').value.trim();
    if (!token) {
      showResponse('QR IDを入力してください / Please enter QR ID', true);
      return;
    }
    showResponse(waitMsg(currentLang), false);
    try {
      const res = await fetch(BASE + '/qr/' + encodeURIComponent(token));
      const data = await res.json();
      if (!res.ok) {
        showResponse(data.error || errMsg(currentLang), true);
      } else {
        const info = [
          'QR ID: ' + data.qr_id,
          'Status: ' + data.status,
          'Valid: ' + (data.is_valid !== undefined ? data.is_valid : '-'),
          'Departure: ' + (data.departure_hub || '-'),
          'Arrival: ' + (data.arrival_hub || '-'),
        ].join('\n');
        showResponse(info, false);
      }
    } catch (_) {
      showResponse(errMsg(currentLang), true);
    }
  }
</script>
</body>
</html>
